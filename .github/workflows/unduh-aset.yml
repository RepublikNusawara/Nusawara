name: Unduh aset video (sementara)
on:
  push:
    branches: [aset-video-sementara]
    paths: ['.github/workflows/unduh-aset.yml']
permissions:
  contents: write
jobs:
  unduh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file
        run: |
          mkdir -p aset14
          curl -sSfL -o aset14/p74.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/3yvNF8cFPUQ0eDqEXIG9/cAXo8ViiIhMPaktE8bTm/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=bvy2CzRyYYoSZPNXsEscTTExPlM="
          curl -sSfL -o aset14/j74.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/gojsRzHdfFArTVPiVIU2/YMfAuT5DWsBUNH1G29vM/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=V4qPJmKVTnoNdIHF2A4i6Wxbsxg="
          ls -la aset14
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset14
          git commit -m "Aset video sementara 14"
          git push
