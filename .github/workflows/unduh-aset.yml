name: Unduh aset video (sementara)
on:
  push:
    branches: [aset-video-sementara]
    paths: ['.github/workflows/unduh-aset.yml']
permissions:
  contents: write
jobs:
  unduh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file
        run: |
          mkdir -p aset15
          curl -sSfL -o aset15/dimas.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/MZbGoBCauv6oOAoVj7Lc/grxJSeYyyFmiWJf2g4c4/content.mp3?Expires=1794621600&KeyName=assets-cdn-key-1&Signature=i0GDgJTssxxC3KHMxI3YRMbXhpc="
          curl -sSfL -o aset15/sari.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/xNdANdit1hHnOjA6Oi1N/67oJldSUvDVd1dJS5g6K/content.mp3?Expires=1794621600&KeyName=assets-cdn-key-1&Signature=8cPzMumicp5iIvWKLF2ICZUjPEQ="
          curl -sSfL -o aset15/bayu.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/TGmOD7911oQN7CmU1w8u/sRN2jHQ2mmmmjo3qGVPX/content.mp3?Expires=1794621600&KeyName=assets-cdn-key-1&Signature=7fvlcd5x1jG_OqTo_dfvlCfmBYo="
          curl -sSfL -o aset15/nadia.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/fblURO0F4PLrpOU4bV0p/j3isSYQKN2T8xDpmA2cN/content.mp3?Expires=1794621600&KeyName=assets-cdn-key-1&Signature=8oP051QJ6EoekKgsutgnqKCgBYo="
          ls -la aset15
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset15
          git commit -m "Aset video sementara 15"
          git push
