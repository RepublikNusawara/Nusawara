name: Unduh aset video (sementara)
on:
  push:
    branches: [aset-video-sementara]
    paths: ['.github/workflows/unduh-aset.yml']
permissions:
  contents: write
jobs:
  unduh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file
        run: |
          mkdir -p aset13
          curl -sSfL -o aset13/p73.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/s3NqXnqkw5S3UflvMPMy/iDi9r0WiAukSTqUtoknY/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=PX8hrpWFUHd1scboF5edoAn1h7E="
          curl -sSfL -o aset13/j73.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/tl2xvMnHPx1iVCaLDgq5/QFsNYi5sjOtpz3cNXUAV/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=vmg3HupT3-vASWIvZWxqo0r1vmA="
          ls -la aset13
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset13
          git commit -m "Aset video sementara 13"
          git push
