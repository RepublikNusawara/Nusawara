name: Unduh aset video (sementara)
on:
  push:
    branches: [aset-video-sementara]
    paths: ['.github/workflows/unduh-aset.yml']
permissions:
  contents: write
jobs:
  unduh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file
        run: |
          mkdir -p aset12
          curl -sSfL -o aset12/p72.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/JunKrJQ7D5rEHusNB8S5/s6epuA682yWnZmE9FJz4/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=knuW28cVtlEItW_HWfo6f86JaxQ="
          curl -sSfL -o aset12/j72.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/30FSg3kCxr0UKC0oM6xk/lHxxvQpPOpGhKpJmXoTe/content.mp3?Expires=1794600000&KeyName=assets-cdn-key-1&Signature=Pbfl77zSQni9yQPcMKs0qhXyeX8="
          ls -la aset12
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset12
          git commit -m "Aset video sementara 12"
          git push
