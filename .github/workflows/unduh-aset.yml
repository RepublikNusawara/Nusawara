name: Unduh aset video (sementara)
on:
  push:
    branches: [aset-video-sementara]
    paths: ['.github/workflows/unduh-aset.yml']
permissions:
  contents: write
jobs:
  unduh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh file
        run: |
          mkdir -p aset3
          curl -sSfL -o aset3/p9.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/UZ5SJ90ihIbi1q8texkD/VqHcHPNFVGorVfq5VMJq/content.mp3?Expires=1794531600&KeyName=assets-cdn-key-1&Signature=WGIAd0HLsUJM1nDOfH7uxieZnbE="
          curl -sSfL -o aset3/j9.mp3 "https://elevenlabsusercontent.com/database/workspace/4ee4162183f742c7886151fbe9d03a47/content_generation/pA2wrzBWeT0vKRUKd9b4/RFsKF3EgBfLmBv44YBM7/content.mp3?Expires=1794531600&KeyName=assets-cdn-key-1&Signature=SVprljrP3ppewonBbpb1qmpzSLg="
          ls -la aset3
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset3
          git commit -m "Aset video sementara 2"
          git push
